<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Wrennote</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../icon.png">
<style>
  :root { --bg: #EAF1FF; --card: #FFFFFF; --ink: #23264A; --muted: #5D6285; --sun: #FFD23F; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16171D; --card: #23252E; --ink: #ECEBFA; --muted: #A7AACB; } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 18px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 420px; padding: 24px 16px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; border: 2.5px solid #23264A; }
  h1 { margin: 12px 0 6px; font-size: 32px; letter-spacing: -1px; }
  p { color: var(--muted); margin: 0 0 22px; }
  .badge { display: block; margin: 12px 0; padding: 14px 18px; border-radius: 16px; border: 2.5px solid #23264A; background: var(--sun); color: #23264A; font-weight: 800; text-decoration: none; box-shadow: 0 4px 0 #23264A; }
  .store { display: block; margin: 12px auto; width: fit-content; }
  .store img { display: block; height: 54px; width: auto; border: 0; border-radius: 0; }
  .store img.play { height: 79px; margin: -13px; } /* Google's official badge, unaltered; negative margin cancels its built-in clear space */
  .badge.soon { background: var(--card); color: var(--ink); border-color: var(--ink); box-shadow: 0 4px 0 var(--ink); }
</style>
</head>
<body>
<main>
  <img src="../icon.png" alt="">
  <h1>Wrennote</h1>
  <p id="msg">Private voice notes. Pick your phone.</p>
  <div id="links">
    <a class="store" id="ios" href="https://apps.apple.com/app/id6829580267"><img src="../app-store.svg" alt="Download on the App Store" width="162" height="54"></a>
    <a class="store" id="android" href="https://play.google.com/store/apps/details?id=com.wrennote.app"><img class="play" src="../google-play.png" alt="Get it on Google Play" width="204" height="79"></a>
    <span class="badge soon" id="soon" hidden>Google Play: coming soon</span>
  </div>
  <p style="margin-top:22px"><a href="../" style="color:inherit">About Wrennote</a></p>
</main>
<script>
  // Flip to true on the day the Android app is public on Google Play.
  var PLAY_LIVE = true;
  var ua = navigator.userAgent;
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var android = document.getElementById('android');
  var soon = document.getElementById('soon');
  if (!PLAY_LIVE) { android.hidden = true; soon.hidden = false; }
  // ?ct=campaign-name (e.g. from an ad) is passed on to Apple's App Analytics campaign tracking.
  var ct = (new URLSearchParams(location.search).get('ct') || '').replace(/[^\w-]/g, '').slice(0, 40);
  if (ct) document.getElementById('ios').href = 'https://apps.apple.com/app/apple-store/id6829580267?pt=431076&ct=' + ct + '&mt=8';
  if (isIOS) {
    location.replace(document.getElementById('ios').href);
  } else if (isAndroid && PLAY_LIVE) {
    location.replace(android.href);
  } else if (isAndroid) {
    document.getElementById('ios').hidden = true;
    document.getElementById('msg').textContent = 'Wrennote is coming to Google Play very soon.';
  }
</script>
</body>
</html>
